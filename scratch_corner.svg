<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="cornerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Outer Main Architectural Rules -->
  <path d="M 4 116 L 4 32 C 4 16 16 4 32 4 L 116 4" stroke="url(#cornerGoldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 12 108 L 12 36 C 12 22 22 12 36 12 L 108 12" stroke="url(#cornerGoldGrad)" stroke-width="1" stroke-opacity="0.75" stroke-linecap="round" />
  <path d="M 18 96 L 18 40 C 18 28 28 18 40 18 L 96 18" stroke="url(#cornerGoldGrad)" stroke-width="0.6" stroke-dasharray="3 3" stroke-opacity="0.6" />

  <!-- Diagonal Chevron Accents -->
  <path d="M 6 48 L 18 36 L 36 18 L 48 6" stroke="url(#cornerGoldGrad)" stroke-width="0.8" stroke-opacity="0.5" />
  <path d="M 10 56 L 24 42 L 42 24 L 56 10" stroke="url(#cornerGoldGrad)" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Graceful Symmetrical Filigree Scrolls -->
  <!-- Top Arm Flourish -->
  <path d="M 26 26 C 38 18 56 16 76 15 C 88 14 98 10 104 4 C 100 10 90 17 76 18 C 58 19 42 22 32 30" fill="url(#cornerGoldGrad)" fill-opacity="0.7" />
  <!-- Left Arm Flourish (Mirrored) -->
  <path d="M 26 26 C 18 38 16 56 15 76 C 14 88 10 98 4 104 C 10 100 17 90 18 76 C 19 58 22 42 30 32" fill="url(#cornerGoldGrad)" fill-opacity="0.7" />

  <!-- Diagonal Spearhead & Center Motif -->
  <path d="M 26 26 L 50 50 M 46 44 L 56 56 L 44 46" stroke="url(#cornerGoldGrad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="56,56 62,53 66,66 53,62" fill="url(#cornerGoldGrad)" />

  <!-- Central Faceted Royal 8-Point Diamond Star -->
  <!-- Primary Cardinal Points -->
  <polygon points="26,6 29,22 26,26" fill="url(#goldLight)" />
  <polygon points="26,6 23,22 26,26" fill="url(#goldDark)" />
  <polygon points="46,26 30,23 26,26" fill="url(#goldLight)" />
  <polygon points="46,26 30,29 26,26" fill="url(#goldDark)" />
  <polygon points="26,46 29,30 26,26" fill="url(#goldLight)" />
  <polygon points="26,46 23,30 26,26" fill="url(#goldDark)" />
  <polygon points="6,26 22,23 26,26" fill="url(#goldLight)" />
  <polygon points="6,26 22,29 26,26" fill="url(#goldDark)" />

  <!-- Diagonal Sub-Points -->
  <polygon points="12,12 22,23 26,26" fill="url(#goldLight)" />
  <polygon points="12,12 23,22 26,26" fill="url(#goldDark)" />
  <polygon points="40,12 29,22 26,26" fill="url(#goldLight)" />
  <polygon points="40,12 30,23 26,26" fill="url(#goldDark)" />
  <polygon points="40,40 30,29 26,26" fill="url(#goldLight)" />
  <polygon points="40,40 29,30 26,26" fill="url(#goldDark)" />
  <polygon points="12,40 22,30 26,26" fill="url(#goldLight)" />
  <polygon points="12,40 23,29 26,26" fill="url(#goldDark)" />

  <!-- Central Diamond Core -->
  <polygon points="26,22 30,26 26,30 22,26" fill="#ffffff" stroke="#fbbf24" stroke-width="0.8" />
  <circle cx="26" cy="26" r="1.5" fill="#fef08a" />

  <!-- Studded Diamond Accents on Rails -->
  <polygon points="64,1 67,4 64,7 61,4" fill="url(#goldLight)" stroke="#b45309" stroke-width="0.5" />
  <polygon points="1,64 4,67 7,64 4,61" fill="url(#goldLight)" stroke="#b45309" stroke-width="0.5" />
  <polygon points="92,1 95,4 92,7 89,4" fill="url(#goldLight)" stroke="#b45309" stroke-width="0.5" />
  <polygon points="1,92 4,95 7,92 4,89" fill="url(#goldLight)" stroke="#b45309" stroke-width="0.5" />

  <!-- Terminal Finials -->
  <circle cx="116" cy="4" r="2" fill="url(#goldLight)" />
  <circle cx="4" cy="116" r="2" fill="url(#goldLight)" />
</svg>